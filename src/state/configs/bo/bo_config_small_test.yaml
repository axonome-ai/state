# Small Bayesian Optimization Test Configuration
# This runs a quick test to verify both random and guided phase functionality

# Dataset configuration
dataset_dir_path: "/home/hackerman/Github/state/competition_support_set/withPhases"
base_config_path: "${dataset_dir_path}/selected_h1_holdout.toml"
output_dir: "competition_bo_small_test"
max_steps: 100  # Very small for quick testing
n_calls: 10  # 10 total iterations
n_initial_points: 5  # 5 random + 5 guided
random_state: 42

# Search space bounds
search_space:
  input_dropout:
    options: [0.0, 0.1, 0.2]
    description: "Input dropout rate (simplified for testing)"
  
  loss_fn:
    options: ["energy", "mse"]
    description: "Loss function to use (simplified for testing)"
  
  lr_scheduler:
    options: ["cosine_annealing", "one_cycle"]
    description: "Learning rate scheduler (simplified for testing)"
  
  warmup_enabled:
    options: [true, false]
    description: "Whether to enable warmup"
  
  basal_mapping_strategy:
    options: ["batch", "random", "phase"]
    description: "Strategy for mapping basal cells to perturbed cells (batch=same batch, random=random sampling, phase=phase-based mapping)"
  
  learning_rate:
    options: [0.0001, 0.001]
    description: "Learning rate for training (simplified for testing)"
  
  phase_enabled:
    options: [true, false]
    description: "Whether to enable phase functionality (both model and data phase)"

# Target metric
target_metric: "discrimination_score_l1"
metric_description: "Perturbation ranking score (higher is better)"

# Training parameters (fixed)
training_params:
  data:
    num_workers: 8
    batch_col: "batch_var"
    pert_col: "target_gene"
    cell_type_key: "cell_type"
    control_pert: "non-targeting"
    perturbation_features_file: "${dataset_dir_path}/ESM2_pert_features.pt"
    esm_perts_only:
      enabled: true
  
  training:
    ckpt_every_n_steps: 50  # Checkpoint every 50 steps for small test
    val_freq: 50  # Validate every 50 steps for small test
  
  model: "state_sm"
  
  validations:
    diff_exp:
      enable: true
    perturbation:
      enable: true

# Evaluation parameters
evaluation:
  dataset_dir_path: "/home/hackerman/Github/state/competition_support_set/withPhases"
  holdout_data_path: "${dataset_dir_path}/h1_holdout/competition_train_h1_holdout_phase_augmented.h5"
  adata_path: "${dataset_dir_path}/selected_h1_holdout.toml"
  n_checkpoints: 0
  prepro: true
  seed: 42
  ctrl_pert_option: "replace"
