# Cosine Annealing Learning Rate Policy
# This policy implements cosine annealing with optional warmup, which is often effective
# for transformer-based models and state transition models.

name: cosine_annealing
max_lr: 1e-4
min_lr: 1e-6
warmup_steps: 1000
warmup_ratio: 0.1
T_max: null  # Will use total training steps if null
eta_min_ratio: 0.1
