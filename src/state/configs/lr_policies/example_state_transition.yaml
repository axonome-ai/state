# Example configuration for State Transition Model with Learning Rate Policy
# This shows how to configure the state transition model with different learning rate policies

model:
  name: state_transition
  lr_policy_config:
    name: cosine_annealing
    max_lr: 1e-4
    min_lr: 1e-6
    warmup_steps: 2000
    warmup_ratio: 0.1
    T_max: null  # Will use total training steps
    eta_min_ratio: 0.1

# Alternative configurations you can use:

# OneCycle Policy (for faster convergence):
# lr_policy_config:
#   name: one_cycle
#   max_lr: 1e-4
#   pct_start: 0.3
#   anneal_strategy: cos
#   div_factor: 25.0
#   final_div_factor: 10000.0

# Warmup Cosine Restarts (for escaping local minima):
# lr_policy_config:
#   name: warmup_cosine_restarts
#   max_lr: 1e-4
#   min_lr: 1e-6
#   warmup_steps: 1000
#   T_0: 10000
#   T_mult: 1
#   eta_min_ratio: 0.1

# Reduce on Plateau (for fine-tuning):
# lr_policy_config:
#   name: reduce_on_plateau
#   max_lr: 1e-4
#   min_lr: 1e-6
#   warmup_steps: 1000
#   mode: min
#   factor: 0.5
#   patience: 10
#   threshold: 1e-4
#   cooldown: 0

# Polynomial Decay (for long training runs):
# lr_policy_config:
#   name: polynomial_decay
#   max_lr: 1e-4
#   min_lr: 1e-6
#   warmup_steps: 1000
#   power: 1.0
