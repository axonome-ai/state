# This is a template used in the application to generating the config file for
# training tasks
defaults:
  - data: perturbation
  - model: pertsets
  - training: default
  - wandb: default
  - _self_
  

# output_dir must be an absolute path (so that launch scripts are fully descriptive)
name: debug
output_dir: ./debugging
use_wandb: true
overwrite: false
return_adatas: false
pred_adata_path: null
true_adata_path: null


validations:
  diff_exp:
    enable: false
    eval_interval_multiple: 1
    obs_pert_col: target_gene
    obs_filter_label: non-targeting
    top_k_rank: 200
    method: null

  perturbation:
    enable: false
    eval_interval_multiple: 1
    pert_col: target_gene
    ctrl_label: non-targeting

# don't save hydra output
hydra:
  output_subdir: null
  run:
    dir: .
  job_logging:
    formatters:
      simple:
        format: "[%(levelname)s] %(message)s"  # Simple format for logging
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        level: INFO
        stream: ext://sys.stdout
    root:
      level: INFO
    loggers:
      __main__:
        level: DEBUG
        handlers: [console]
        propagate: false
